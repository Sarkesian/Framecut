<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Small-size FrameCut mark (16–40 px): same shapes, bolder, no fine details. -->
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a303c"/><stop offset="1" stop-color="#101217"/></linearGradient>
    <linearGradient id="slime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6fb8a"/><stop offset="1" stop-color="#a6ec6c"/></linearGradient>
    <linearGradient id="smint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93f2d3"/><stop offset="1" stop-color="#55d6ad"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#sbg)"/>
  <rect x="8" y="7" width="5" height="18" rx="1.8" fill="url(#slime)"/>
  <rect x="14" y="7" width="10.5" height="5" rx="1.8" fill="url(#slime)"/>
  <rect x="14" y="14.2" width="7" height="4.6" rx="1.7" fill="url(#smint)"/>
